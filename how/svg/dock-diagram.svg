<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="t" role="img" viewBox="0 0 1600 1000"><title id="t">A truck arrives at the yard, checks in at the gate, backs to a dock door where forklifts unload it into storage. The time before the gate is the gate wait, the time at the door is the door time.</title><style>@keyframes a{0%{transform:translateX(-150px)}35%{transform:translateX(0)}}:root{--bg:#f6f8fb;--plate:#dfe7f2;--stud:#cbd6e6;--road:#3b4658;--mark:#f4f6fa;--line:#c3ccda;--ink:#1c2230;--dim:#4f5d75;--src:#2f7df6;--stor:#f08a24;--truck:#eef1f6;--cab:#6b778c;--fork:#f5b82e;--acc:#1f5fd1;--gate:#cc7a00}@media (prefers-color-scheme:dark){:root{--bg:#1a202a;--plate:#263143;--stud:#324057;--road:#0f1319;--mark:#6b778c;--line:#3d495c;--ink:#e6ebf5;--dim:#a3afc4;--src:#2a71dd;--stor:#d87c20;--truck:#c9d2e2;--cab:#8a97ad;--fork:#f5b94c;--acc:#7fb1ff;--gate:#f5b94c}}.t{font:600 36px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;fill:var(--ink)}.a{fill:var(--acc)}.b{font:700 26px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.v{fill:var(--truck);stroke:var(--line);stroke-width:3}.c{fill:var(--cab)}.k,.l{fill:none;stroke:var(--acc);stroke-width:5}.l{stroke:var(--dim);stroke-width:4}@media (prefers-reduced-motion:no-preference){.tr{animation:a 6s ease-in-out infinite}.fk{animation:f 3s ease-in-out infinite alternate}}</style><defs><pattern id="s" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="7" fill="var(--stud)"/></pattern></defs><rect width="1600" height="1000" fill="var(--bg)"/><rect width="1520" height="920" x="40" y="40" fill="url(#s)" stroke="none" rx="28"/><rect width="1520" height="920" x="40" y="40" fill="var(--plate)" opacity=".55" rx="28"/><g aria-hidden="true"><g fill="none" stroke="var(--road)" stroke-width="90"><path d="M60,300H645M600,160V640"/></g><g fill="none" stroke="var(--road)" stroke-width="96"><path d="M600,230H940M600,400H1200M600,570H940"/></g><path fill="none" stroke="var(--mark)" stroke-dasharray="18 14" stroke-width="4" d="M60,300H560"/><rect width="100" height="500" x="940" y="150" fill="var(--src)" rx="12"/><text x="990" y="400" fill="#fff" class="b" text-anchor="middle" transform="rotate(-90 990 400)">Goods in</text><rect width="330" height="500" x="1200" y="150" fill="var(--stor)" rx="12"/><text x="1365" y="410" fill="#1c2230" class="b" text-anchor="middle">Storage</text><g><rect width="150" height="52" x="70" y="274" class="v" rx="8"/><rect width="44" height="48" x="222" y="276" class="c" rx="10"/></g><g><rect width="150" height="52" x="280" y="274" class="v" rx="8"/><rect width="44" height="48" x="432" y="276" class="c" rx="10"/></g><rect width="16" height="100" x="512" y="250" fill="var(--gate)" rx="5"/><g><rect width="238" height="52" x="700" y="204" class="v" rx="8"/><rect width="46" height="48" x="652" y="206" class="c" rx="10"/></g><g class="tr"><rect width="238" height="52" x="700" y="374" class="v" rx="8"/><rect width="46" height="48" x="652" y="376" class="c" rx="10"/></g><g class="fk"><rect width="70" height="40" x="1060" y="380" fill="var(--fork)" rx="8"/><rect width="40" height="6" x="1128" y="386" fill="var(--fork)"/><rect width="40" height="6" x="1128" y="408" fill="var(--fork)"/></g><path d="M70,410H480M70,395V425M480,395V425" class="k"/><text x="275" y="475" class="t a" text-anchor="middle">Gate wait</text><path d="M700,150H938M700,135V165M938,135V165" class="k"/><text x="819" y="108" class="t a" text-anchor="middle">Door time</text><text x="70" y="215" class="t">Trucks arrive</text><path d="M520,820V360M800,820V620M1365,820V660" class="l"/><text x="440" y="870" class="t" text-anchor="middle">Gate: check in</text><text x="860" y="870" class="t" text-anchor="middle">Doors: unloading</text><text x="1365" y="870" class="t" text-anchor="middle">Forklifts carry it in</text></g></svg>