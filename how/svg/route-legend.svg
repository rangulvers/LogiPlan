<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t">
<title id="t">How to read the routes the plan draws for a vehicle: line width is trips, colour is time lost waiting, dashes are empty or depot runs, a ring marks where it queues.</title>
<style>
:root{--bg:#f6f8fb;--plate:#dfe7f2;--stud:#cbd6e6;--road:#3b4658;--mark:#f4f6fa;--card:#fff;--line:#c3ccda;--ink:#1c2230;--dim:#4f5d75;--src:#2f7df6;--snk:#3dbb6d;--dep:#8a63d2;--lo:#2f7df6;--mid:#f5b84c;--hi:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#1a202a;--plate:#263143;--stud:#324057;--road:#0f1319;--mark:#6b778c;--card:#202735;--line:#3d495c;--ink:#e6ebf5;--dim:#a3afc4;--src:#2a71dd;--snk:#37a862;--dep:#7c59bd;--lo:#5b9bff;--mid:#f5b94c;--hi:#ff6b6b}}
.t{font:600 38px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--ink)}
.b{font:700 25px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff}
.r{fill:none;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:no-preference){.march{animation:m 1.6s linear infinite}.ring{transform-box:fill-box;transform-origin:center;animation:p 2.2s ease-in-out infinite}}
@keyframes m{to{stroke-dashoffset:-44}}
@keyframes p{50%{transform:scale(1.18);opacity:.55}}
</style>
<defs>
<pattern id="s" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="7" fill="var(--stud)"/></pattern>
<linearGradient id="g"><stop offset="0" stop-color="var(--lo)"/><stop offset=".5" stop-color="var(--mid)"/><stop offset="1" stop-color="var(--hi)"/></linearGradient>
</defs>
<rect width="1600" height="1000" fill="var(--bg)"/>
<rect x="40" y="40" width="1520" height="920" rx="28" fill="var(--plate)"/>
<rect x="40" y="40" width="1520" height="920" rx="28" fill="url(#s)"/>
<g aria-hidden="true">
<path class="r" stroke="var(--road)" stroke-width="64" stroke-linejoin="miter" d="M250,220H1350V780H250Z"/>
<path class="r" stroke="var(--road)" stroke-width="64" d="M200,500H250M1350,500H1400M800,780V850"/>
<path class="r" stroke="var(--mark)" stroke-width="4" stroke-dasharray="18 14" stroke-linecap="butt" d="M250,220H1350V780H250Z"/>
<rect x="70" y="440" width="150" height="120" rx="12" fill="var(--src)"/><text class="b" x="145" y="512" text-anchor="middle">Goods in</text>
<rect x="1380" y="440" width="150" height="120" rx="12" fill="var(--snk)"/><text class="b" x="1455" y="512" text-anchor="middle" style="fill:#1c2230">Goods out</text>
<rect x="710" y="850" width="180" height="90" rx="12" fill="var(--dep)"/><text class="b" x="800" y="907" text-anchor="middle">Parking</text>
<path class="r" stroke="var(--hi)" stroke-width="30" d="M220,500H250V220H1350V500H1380"/>
<path class="r" stroke="var(--lo)" stroke-width="16" d="M800,850V780H250V500H220"/>
<path class="r march" stroke="var(--mid)" stroke-width="12" stroke-dasharray="26 18" d="M1380,500H1350V780H800V850"/>
<circle class="ring" cx="620" cy="220" r="58" fill="none" stroke="var(--hi)" stroke-width="7" stroke-dasharray="14 10"/>
<rect x="380" y="300" width="840" height="400" rx="26" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
<path class="r" stroke="var(--dim)" stroke-width="26" d="M440,380H520"/><path class="r" stroke="var(--dim)" stroke-width="8" d="M550,380H630"/>
<rect x="440" y="456" width="190" height="24" rx="12" fill="url(#g)"/>
<path class="r march" stroke="var(--dim)" stroke-width="10" stroke-dasharray="26 18" d="M440,560H630"/>
<circle class="ring" cx="535" cy="640" r="30" fill="none" stroke="var(--hi)" stroke-width="6" stroke-dasharray="12 8"/>
<text class="t" x="680" y="393">Width: how many trips</text>
<text class="t" x="680" y="481">Colour: time lost waiting</text>
<text class="t" x="680" y="573">Dashed: empty or to a depot</text>
<text class="t" x="680" y="653">Ring: where it queues</text>
</g>
</svg>
