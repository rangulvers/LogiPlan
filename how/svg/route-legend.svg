<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="t" role="img" viewBox="0 0 1600 1000"><title id="t">How to read the routes the plan draws for a vehicle: line width is trips, colour is time lost waiting, dashes are empty or depot runs, a ring marks where it queues.</title><style>@keyframes p{50%{transform:scale(1.18);opacity:.55}}:root{--bg:#f6f8fb;--plate:#dfe7f2;--stud:#cbd6e6;--road:#3b4658;--mark:#f4f6fa;--card:#fff;--line:#c3ccda;--ink:#1c2230;--dim:#4f5d75;--src:#2f7df6;--snk:#3dbb6d;--dep:#8a63d2;--lo:#2f7df6;--mid:#f5b84c;--hi:#e5484d}@media (prefers-color-scheme:dark){:root{--bg:#1a202a;--plate:#263143;--stud:#324057;--road:#0f1319;--mark:#6b778c;--card:#202735;--line:#3d495c;--ink:#e6ebf5;--dim:#a3afc4;--src:#2a71dd;--snk:#37a862;--dep:#7c59bd;--lo:#5b9bff;--mid:#f5b94c;--hi:#ff6b6b}}.t{font:600 38px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;fill:var(--ink)}.b{font:700 25px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;fill:#fff}.r{fill:none;stroke-linecap:round;stroke-linejoin:round}@media (prefers-reduced-motion:no-preference){.march{animation:m 1.6s linear infinite}.ring{transform-box:fill-box;transform-origin:center;animation:p 2.2s ease-in-out infinite}}</style><defs><pattern id="s" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="7" fill="var(--stud)"/></pattern><linearGradient id="g"><stop offset="0" stop-color="var(--lo)"/><stop offset=".5" stop-color="var(--mid)"/><stop offset="1" stop-color="var(--hi)"/></linearGradient></defs><rect width="1600" height="1000" fill="var(--bg)"/><rect width="1520" height="920" x="40" y="40" fill="var(--plate)" rx="28"/><rect width="1520" height="920" x="40" y="40" fill="url(#s)" rx="28"/><g aria-hidden="true"><path stroke="var(--road)" stroke-linejoin="miter" stroke-width="64" d="M250,220H1350V780H250Z" class="r"/><path stroke="var(--road)" stroke-width="64" d="M200,500H250M1350,500H1400M800,780V850" class="r"/><path stroke="var(--mark)" stroke-dasharray="18 14" stroke-linecap="butt" stroke-width="4" d="M250,220H1350V780H250Z" class="r"/><rect width="150" height="120" x="70" y="440" fill="var(--src)" rx="12"/><text x="145" y="512" class="b" text-anchor="middle">Goods in</text><rect width="150" height="120" x="1380" y="440" fill="var(--snk)" rx="12"/><text x="1455" y="512" class="b" text-anchor="middle" style="fill:#1c2230">Goods out</text><rect width="180" height="90" x="710" y="850" fill="var(--dep)" rx="12"/><text x="800" y="907" class="b" text-anchor="middle">Parking</text><path stroke="var(--hi)" stroke-width="30" d="M220,500H250V220H1350V500H1380" class="r"/><path stroke="var(--lo)" stroke-width="16" d="M800,850V780H250V500H220" class="r"/><path stroke="var(--mid)" stroke-dasharray="26 18" stroke-width="12" d="M1380,500H1350V780H800V850" class="r march"/><circle cx="620" cy="220" r="58" fill="none" stroke="var(--hi)" stroke-dasharray="14 10" stroke-width="7" class="ring"/><rect width="840" height="400" x="380" y="300" fill="var(--card)" stroke="var(--line)" stroke-width="3" rx="26"/><path stroke="var(--dim)" stroke-width="26" d="M440,380H520" class="r"/><path stroke="var(--dim)" stroke-width="8" d="M550,380H630" class="r"/><rect width="190" height="24" x="440" y="456" fill="url(#g)" rx="12"/><path stroke="var(--dim)" stroke-dasharray="26 18" stroke-width="10" d="M440,560H630" class="r march"/><circle cx="535" cy="640" r="30" fill="none" stroke="var(--hi)" stroke-dasharray="12 8" stroke-width="6" class="ring"/><text x="680" y="393" class="t">Width: how many trips</text><text x="680" y="481" class="t">Colour: time lost waiting</text><text x="680" y="573" class="t">Dashed: empty or to a depot</text><text x="680" y="653" class="t">Ring: where it queues</text></g></svg>